# Nginx · Load Balancer de entrada (capa 7)
# Reparte el tráfico entre los dos nodos de Kong con el algoritmo least_conn.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    server_tokens off;

    log_format principal '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                         'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time';
    access_log /dev/stdout principal;
    error_log  /dev/stderr warn;

    upstream gateway {
        least_conn;
        server kong-1:8000 max_fails=3 fail_timeout=10s;
        server kong-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        # Sonda propia del balanceador (no pasa por Kong)
        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","componente":"nginx"}';
        }

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_next_upstream   error timeout http_502 http_503;

            # DIDÁCTICO: permite ver qué nodo de Kong atendió la petición.
            # En producción se elimina porque expone direcciones internas.
            add_header X-Gateway-Node $upstream_addr always;
        }
    }
}
