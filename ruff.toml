line-length = 100
target-version = "py312"

[lint]
# E/W estilo, F errores, I imports, B bugbear, UP modernización, S seguridad (reglas Bandit),
# SIM simplificaciones, N nombres
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "N"]

[lint.per-file-ignores]
"*/tests/*" = ["S101"]          # assert es la herramienta de pytest
"*/migrations/*" = ["E501"]
"locust/*" = ["S311"]           # random no criptográfico es adecuado para simular carga

[lint.isort]
known-first-party = ["app"]
